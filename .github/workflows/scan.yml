name: Scan bosses

on:
  schedule:
    # ทุกนาทีที่ 0,5,10,15,20,25,30,35,40,45,50,55 (UTC) — เวลาคงที่แน่นอน
    - cron: '0,5,10,15,20,25,30,35,40,45,50,55 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

# กันรันซ้อนกัน
concurrency:
  group: scan-bosses
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm install

      - name: Scan bosses (guest)
        run: node scan-bosses.mjs

      - name: Commit bosses.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bosses.json
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "auto: refresh bosses.json"
            git push
          fi
